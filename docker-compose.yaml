version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # 1 gpu
              capabilities: [gpu]

  app:
    build: .
    ports:
      - "8501:8501"  # Streamlit
      - "8888:8888"  # Jupyter
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_models:

# Construye y levanta los servicios:
# docker compose build && docker compose up